
name: CreditPilot Health Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose CreditPilot
        run: |
          curl --silent --show-error \
            --max-time 30 \
            --output /dev/null \
            --dump-header - \
            --write-out '\nHTTP status: %{http_code}\nRedirect URL: %{redirect_url}\n' \
            https://creditpilot-public-portfolio.streamlit.app/_stcore/health

