
name: CreditPilot Browser Health Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check CreditPilot
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://creditpilot-public-portfolio.streamlit.app/"

          REQUIRED = [
              "Credit Risk Intelligence",
              "Golden Scenario Explorer",
              "Bundle Verified",
          ]

          JS_TEXT = """
          () => {
            function collect(root) {
              let result = root.innerText || "";
              const walker = document.createTreeWalker(
                root, NodeFilter.SHOW_ELEMENT
              );
              let node;
              while ((node = walker.nextNode())) {
                if (node.shadowRoot) {
                  result += " " + collect(node.shadowRoot);
                }
              }
              return result;
            }
            return collect(document.body);
          }
          """

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 900}
              )

              try:
                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  if not response or response.status != 200:
                      raise RuntimeError("HTTP check failed")

                  deadline = time.monotonic() + 90
                  success = False

                  while time.monotonic() < deadline:
                      for frame in page.frames:
                          try:
                              content = frame.evaluate(JS_TEXT)

                              found = {
                                  key: key in content
                                  for key in REQUIRED
                              }

                              print(
                                  "Frame:", frame.url,
                                  "Checks:", found,
                                  flush=True
                              )

                              if all(found.values()):
                                  success = True
                                  break

                          except Exception as e:
                              print(
                                  "Frame error:", str(e),
                                  flush=True
                              )

                      if success:
                          break

                      page.wait_for_timeout(5000)

                  page.screenshot(
                      path="creditpilot-health.png",
                      full_page=True
                  )

                  if not success:
                      raise RuntimeError(
                          "CreditPilot content not detected"
                      )

                  print(
                      "SUCCESS: CreditPilot portfolio loaded",
                      flush=True
                  )

              finally:
                  browser.close()
          PY

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creditpilot-health-screenshot
          path: creditpilot-health.png
          if-no-files-found: ignore
          retention-days: 7
