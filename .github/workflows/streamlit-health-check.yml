
name: CreditPilot Browser Health Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Diagnose CreditPilot browser
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://creditpilot-public-portfolio.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 900}
              )

              errors = []
              websockets = []

              page.on(
                  "pageerror",
                  lambda error: errors.append(str(error))
              )

              page.on(
                  "console",
                  lambda msg: errors.append(
                      "Console: " + msg.text
                  ) if msg.type == "error" else None
              )

              def on_websocket(ws):
                  websockets.append(ws.url)
                  print("WebSocket opened:", ws.url, flush=True)
                  ws.on(
                      "close",
                      lambda _: print(
                          "WebSocket closed:", ws.url,
                          flush=True
                      )
                  )
                  ws.on(
                      "socketerror",
                      lambda error: print(
                          "WebSocket error:", str(error),
                          flush=True
                      )
                  )

              page.on("websocket", on_websocket)

              try:
                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  print(
                      "HTTP status:",
                      response.status if response else "N/A",
                      flush=True
                  )
                  print("Final URL:", page.url, flush=True)
                  print("Title:", page.title(), flush=True)

                  # Wait for Streamlit to render
                  for i in range(12):
                      time.sleep(5)

                      count = page.locator(
                          '[data-testid="stAppViewContainer"]'
                      ).count()

                      print(
                          f"Check {i+1}: container={count}",
                          flush=True
                      )

                      if count > 0:
                          break

                  print(
                      "Final URL:", page.url,
                      flush=True
                  )

                  print(
                      "Body preview:",
                      page.locator("body").inner_text()[:500],
                      flush=True
                  )

                  print(
                      "WebSocket count:",
                      len(websockets),
                      flush=True
                  )

                  print(
                      "JavaScript errors:",
                      errors[:10],
                      flush=True
                  )

                  page.screenshot(
                      path="creditpilot-diagnostic.png",
                      full_page=True,
                      timeout=15000
                  )

                  if page.locator(
                      '[data-testid="stAppViewContainer"]'
                  ).count() == 0:
                      raise RuntimeError(
                          "Streamlit application did not render"
                      )

                  print(
                      "SUCCESS: Streamlit container detected",
                      flush=True
                  )

              finally:
                  browser.close()
          PY

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creditpilot-diagnostic
          path: creditpilot-diagnostic.png
          if-no-files-found: ignore
          retention-days: 7
