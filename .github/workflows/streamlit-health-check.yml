
name: CreditPilot Browser Health Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check CreditPilot
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://creditpilot-public-portfolio.streamlit.app/"

          REQUIRED_TEXT = [
              "Credit Risk Intelligence",
              "Golden Scenario Explorer",
              "Bundle Verified",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 900}
              )

              try:
                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  print("HTTP:", response.status if response else "N/A")
                  print("URL:", page.url)

                  if "share.streamlit.io/-/auth/" in page.url:
                      raise RuntimeError("Authentication redirect")

                  # Wait up to 90 seconds for portfolio content
                  deadline = time.monotonic() + 90
                  missing = REQUIRED_TEXT

                  while time.monotonic() < deadline:
                      body = page.locator("body").inner_text(
                          timeout=10000
                      )

                      missing = [
                          text for text in REQUIRED_TEXT
                          if text not in body
                      ]

                      if not missing:
                          break

                      print("Waiting for:", missing, flush=True)
                      page.wait_for_timeout(5000)

                  page.screenshot(
                      path="creditpilot-health.png",
                      full_page=True
                  )

                  if missing:
                      raise RuntimeError(
                          "Missing portfolio content: "
                          + ", ".join(missing)
                      )

                  print(
                      "SUCCESS: CreditPilot portfolio loaded",
                      flush=True
                  )

              except Exception as error:
                  print("FAILED:", error, flush=True)
                  try:
                      page.screenshot(
                          path="creditpilot-health.png",
                          full_page=True,
                          timeout=10000
                      )
                  except Exception:
                      pass
                  raise

              finally:
                  browser.close()
          PY

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creditpilot-health-screenshot
          path: creditpilot-health.png
          if-no-files-found: ignore
          retention-days: 7
