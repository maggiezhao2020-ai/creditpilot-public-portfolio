
name: CreditPilot Browser Health Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check CreditPilot
        run: |
          python - <<'PY'
          from playwright.sync_api import (
              sync_playwright,
              TimeoutError as PlaywrightTimeout
          )

          URL = "https://creditpilot-public-portfolio.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 900}
              )

              try:
                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  print("Final URL:", page.url, flush=True)

                  if "share.streamlit.io/-/auth/" in page.url:
                      raise RuntimeError(
                          "Redirected to authentication"
                      )

                  # Verify actual CreditPilot content
                  page.get_by_text(
                      "Credit Risk Intelligence, Built for Explainable Decisions.",
                      exact=True
                  ).wait_for(
                      state="visible",
                      timeout=90000
                  )

                  page.get_by_text(
                      "Golden Scenario Explorer",
                      exact=True
                  ).wait_for(
                      state="visible",
                      timeout=15000
                  )

                  page.screenshot(
                      path="creditpilot-health.png",
                      full_page=True
                  )

                  print(
                      "SUCCESS: CreditPilot portfolio is visible",
                      flush=True
                  )

              except Exception as error:
                  print(
                      "HEALTH CHECK FAILED:",
                      str(error),
                      flush=True
                  )

                  try:
                      page.screenshot(
                          path="creditpilot-health.png",
                          full_page=True,
                          timeout=10000
                      )
                  except Exception:
                      pass

                  raise

              finally:
                  browser.close()
          PY

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creditpilot-health-screenshot
          path: creditpilot-health.png
          if-no-files-found: ignore
          retention-days: 7
